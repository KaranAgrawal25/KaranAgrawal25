name: Update live README section

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch: {}       # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update-live-section:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repo
        uses: actions/checkout@v4

      - name: Fetch latest activity across repos
        id: fetch
        env:
          GH_USER: KaranAgrawal25
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SELF_REPO: KaranAgrawal25/KaranAgrawal25
        run: |
          # Pull recent public push events for the account
          EVENTS=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/users/$GH_USER/events/public?per_page=30")

          {
            echo "block<<EOF"
            echo "| Repo | Latest commit | When |"
            echo "|---|---|---|"
            echo "$EVENTS" | jq -r --arg self "$SELF_REPO" '
              [.[] | select(.type=="PushEvent") | select(.repo.name != $self)][0:5][] |
              . as $e |
              ($e.payload.commits // [] | map(select(.message != null and .message != "")) | last) as $c |
              "| " + $e.repo.name + " | " +
                (($c.message // "updated") | split("\n")[0] | .[0:60]) + " | " +
                ($e.created_at | sub("T.*";"")) + " |"
            '
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Inject into README
        run: |
          python3 - <<'PYEOF'
          import re, os

          with open("README.md", "r") as f:
              content = f.read()

          block = os.environ["BLOCK"]
          new_section = f"<!--LIVE-COMMIT-START-->\n{block}\n<!--LIVE-COMMIT-END-->"

          content = re.sub(
              r"<!--LIVE-COMMIT-START-->.*?<!--LIVE-COMMIT-END-->",
              new_section,
              content,
              flags=re.DOTALL,
          )

          with open("README.md", "w") as f:
              f.write(content)
          PYEOF
        env:
          BLOCK: ${{ steps.fetch.outputs.block }}

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: update live activity section"
          git push
